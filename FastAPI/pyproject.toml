[project]
name = "fastapi-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohithnagachintu", email = "mohithnaga@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
fastapi-app = "fastapi_app:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]